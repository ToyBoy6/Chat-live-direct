<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamChat Studio Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090a0f;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* En-tête / Barre d'outils */
    .header {
      background: linear-gradient(135deg, #13151f 0%, #1a1d2d 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #ff2a4b;
      white-space: nowrap;
    }

    .logo-icon {
      width: 10px;
      height: 10px;
      background: #ff2a4b;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff2a4b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .search-container {
      display: flex;
      flex: 1;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .search-container:focus-within {
      border-color: #ff2a4b;
      box-shadow: 0 0 12px rgba(255, 42, 75, 0.25);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    input::placeholder {
      color: #717588;
    }

    button {
      background: linear-gradient(135deg, #ff2a4b 0%, #d60029 100%);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Zone d'affichage du Chat */
    .chat-wrapper {
      flex: 1;
      position: relative;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Inversion légère pour forcer un contraste sombre/texte blanc sur le chat officiel */
      filter: contrast(105%);
    }

    /* Message d'accueil / Placeholder */
    .placeholder {
      position: absolute;
      text-align: center;
      color: #5d6275;
      padding: 20px;
      pointer-events: none;
    }

    .placeholder svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      fill: currentColor;
      opacity: 0.5;
    }

    .placeholder p {
      font-size: 14px;
      font-weight: 500;
    }

    /* Overlay pour ajustement esthétique des commentaires en texte blanc */
    .dark-overlay-fix {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- Barre de recherche supérieure -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon"></div>
      <span>LIVE CHAT</span>
    </div>

    <div class="search-container">
      <input type="text" id="youtubeUrl" placeholder="Entrez l'ID du Live (ex: Pz2PhMpVjws) ou collez l'URL...">
      <button onclick="chargerChat()">Charger</button>
    </div>
  </div>

  <!-- Conteneur d'intégration du chat -->
  <div class="chat-wrapper">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
      <p>Entrez l'ID de votre live pour afficher le chat en direct</p>
    </div>

    <iframe id="chatIframe" src="about:blank"></iframe>
    <div class="dark-overlay-fix"></div>
  </div>

  <script>
    function chargerChat() {
      const input = document.getElementById('youtubeUrl').value.trim();
      if (!input) return;

      // Extraction propre de l'ID YouTube (11 caractères)
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      const videoId = (match && match[2].length === 11) ? match[2] : input;

      if (videoId.length !== 11) {
        alert("⚠️ Veuillez entrer un ID de vidéo ou un lien de Live YouTube valide !");
        return;
      }

      // Masquer le placeholder d'attente
      document.getElementById('placeholder').style.display = 'none';

      // Récupération du domaine dynamique
      let domain = window.location.hostname || "localhost";

      // URL YouTube Chat avec thème sombre forcé
      const chatUrl = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${domain}&theme=dark`;
      
      document.getElementById('chatIframe').src = chatUrl;
    }

    // Permet de valider directement en appuyant sur la touche 'Entrée'
    document.getElementById('youtubeUrl').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        chargerChat();
      }
    });
  </script>
</body>
</html>
