<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat YouTube Live</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 92vh;
    }
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: white;
      font-size: 14px;
    }
    button {
      padding: 10px 16px;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 1px solid #333;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="input-box">
    <input type="text" id="youtubeUrl" placeholder="Collez l'URL ou l'ID du Live (ex: dQw4w9WgXcQ)">
    <button onclick="chargerChat()">Charger</button>
  </div>

  <iframe id="chatIframe" src="about:blank"></iframe>

  <script>
    function chargerChat() {
      const input = document.getElementById('youtubeUrl').value.trim();
      if (!input) {
        alert("Veuillez entrer un lien ou un ID valide !");
        return;
      }
      
      // Extraction propre de l'ID YouTube (11 caractères)
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      const videoId = (match && match[2].length === 11) ? match[2] : input;

      if (videoId.length !== 11) {
        alert("ID de vidéo invalide (doit faire 11 caractères).");
        return;
      }

      // Si ouvert en local, on force un domaine par défaut ou celui de la page
      let domain = window.location.hostname;
      if (!domain || domain === "") {
        domain = "localhost";
      }

      const chatUrl = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${domain}`;
      document.getElementById('chatIframe').src = chatUrl;
    }
  </script>
</body>
</html>
