<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur de Chat Live YouTube</title>
  <style>
    body {
      margin: 0;
      background: #0f0f13;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .controls {
      padding: 12px;
      background: #1a1a24;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #000;
      color: #fff;
    }
    button {
      padding: 8px 16px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="text" id="videoInput" placeholder="Entrez l'ID du Live YouTube (ex: dQw4w9WgXcQ) ou l'URL complète">
    <button onclick="loadChat()">Charger le Chat</button>
  </div>

  <iframe id="chatFrame" src="about:blank"></iframe>

  <script>
    function extractVideoId(input) {
      // Extraire l'ID depuis une URL YouTube ou retourner la valeur directe
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      return (match && match[2].length === 11) ? match[2] : input;
    }

    function loadChat() {
      const inputVal = document.getElementById('videoInput').value.trim();
      const videoId = extractVideoId(inputVal);
      
      if (!videoId) {
        alert("Veuillez entrer un ID de vidéo ou une URL valide !");
        return;
      }

      // Récupération dynamique du domaine pour éviter le blocage X-Frame-Options/Domain restriction
      const currentDomain = window.location.hostname || 'localhost';
      
      // Construction de l'URL d'embed officielle du chat YouTube
      const chatUrl = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${currentDomain}`;
      
      document.getElementById('chatFrame').src = chatUrl;
    }
  </script>
</body>
</html>
